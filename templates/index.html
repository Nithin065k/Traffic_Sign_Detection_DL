<!DOCTYPE html>
<html>
<head>
    <title>Traffic Sign Classification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('/static/bg.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            text-align: center;
            width: 350px;
        }

        input[type="file"] {
            padding: 10px;
            border: none;
            background-color: #530000ff;
            color: #fff;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        input[type="submit"] {
            background-color: #ff4b2b;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background-color: #ff1c1c;
        }

        h2 {
            color: #5e0706ff;
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 20px;
            color: #00ffcc;
        }

        #preview, #serverImage {
            margin-top: 15px;
            width: 300px;
            height: 300px;
            object-fit: contain;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚦 Traffic Sign Classifier</h2>

        <form action="/predict" method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <input type="submit" value="Predict">
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if image_data %}
            <h3>Uploaded Image:</h3>
            <img src="{{ image_data }}" alt="Uploaded Image">
        {% endif %}

        {% if predicted_label %}
            <div class="result">
                <h3>Prediction:</h3>
                <p><b>{{ predicted_label }}</b></p>
                <p>Confidence: {{ '%.2f' % confidence }}%</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
